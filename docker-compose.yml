# Infrastructure only. gateway/config.py now reads upstream/Redis hosts
# from the environment (USER_SERVICE_URLS, ORDER_SERVICE_URLS,
# REDIS_HOST, etc. — see .env.example), but this file doesn't set them,
# so every service still defaults to "localhost" as if run directly on
# the host. Every service here therefore runs with `network_mode: host`
# to keep "localhost:<port>" resolving correctly between containers.
# Host networking works as-is on Linux; on Docker Desktop (macOS/Windows)
# it requires Docker Desktop 4.29+ with host networking enabled, or the
# services should be run natively instead. A future pass could instead
# set container-network hostnames via environment: and drop host
# networking entirely.

services:
  redis:
    image: redis:7-alpine
    network_mode: host

  gateway:
    build: .
    command: uvicorn gateway.main:app --host 0.0.0.0 --port 8000
    network_mode: host
    depends_on:
      - redis
      - user-service
      - user-service-2
      - order-service

  user-service:
    build: .
    command: uvicorn services.user_service:app --host 0.0.0.0 --port 8001
    network_mode: host

  order-service:
    build: .
    command: uvicorn services.order_service:app --host 0.0.0.0 --port 8002
    network_mode: host

  user-service-2:
    build: .
    command: uvicorn services.user_service_2:app --host 0.0.0.0 --port 8003
    network_mode: host
